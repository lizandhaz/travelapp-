# Publishes the landing page (website/) to GitHub Pages whenever it changes on main.
# One-time setup by the owner: GitHub → the repo → Settings → Pages → Source: "GitHub Actions".
name: Publish website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'src/constants/brand.json'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Two jobs (build, then publish), GitHub's standard layout: publishing in the same job as the upload
  # sometimes looked for the upload a moment too early ("No artifacts named github-pages").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the page
        run: node website/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
